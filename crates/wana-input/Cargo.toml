[package]
name = "wana-input"
description = "Wana OS input: libinput devices and events, xkbcommon keymaps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Links the system libudev, libinput and libxkbcommon directly through small
