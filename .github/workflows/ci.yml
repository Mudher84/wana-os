name: ci

on:
  push:
    branches: [main, develop, "feature/**", "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, unit tests, repo checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # rustup (preinstalled on the runner) installs the toolchain pinned in
      # rust-toolchain.toml on first use.
      - name: Toolchain
        run: rustup show active-toolchain && cargo --version && rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: make fmt-check
      - name: Clippy
        run: make lint
      - name: Unit tests
        run: make test
      - name: Repository checks
        run: make repo-check
