name: buildroot

# Stage 4: Buildroot. Runs only when the platform or build glue changes.
on:
  push:
    branches: [main, develop, "feature/**", "claude/**"]
    paths:
      - "platform/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/buildroot.yml"
  pull_request:
    paths:
      - "platform/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/buildroot.yml"
  workflow_dispatch:

concurrency:
  group: buildroot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: defconfig loads and round-trips
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Fetch pinned Buildroot
        run: make buildroot-src
      - name: Check defconfig
        run: make config-check

  toolchain:
    name: toolchain, image, UEFI boot
    needs: config
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Host packages
        run: |
          sudo apt-get update -qq
          grep -v '^#' tools/host-packages-ubuntu.txt | xargs sudo apt-get install -y -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true

      - name: Cache downloads
        uses: actions/cache@v6
        with:
          path: dl
          key: br-dl-${{ hashFiles('platform/buildroot.env', 'platform/configs/*') }}
          restore-keys: br-dl-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.buildroot-ccache
          key: br-ccache-${{ hashFiles('platform/buildroot.env', 'platform/configs/*') }}-${{ github.sha }}
          restore-keys: |
            br-ccache-${{ hashFiles('platform/buildroot.env', 'platform/configs/*') }}-
            br-ccache-

      - name: Build toolchain
        # Full log goes to the artifact; the console shows one line per package step.
        shell: bash
        run: |
          set -o pipefail
          make toolchain 2>&1 | tee toolchain-build.log | { grep -E '^>>>' || true; }

      - name: Smoke-test toolchain
        run: tools/smoke-toolchain.sh out/build/wana_x86_64

      - name: Build image (kernel, Wana packages, rootfs)
        shell: bash
        run: |
          set -o pipefail
          make image 2>&1 | tee image-build.log | { grep -E '^>>>|\[BUILD\]' || true; }

      - name: Show end of build log (on failure)
        if: failure()
        run: tail -n 80 image-build.log toolchain-build.log 2>/dev/null || true

      - name: Build manifest
        run: |
          cat out/build/wana_x86_64/images/SHA256SUMS
          python3 -c "import json,sys; m=json.load(open('out/build/wana_x86_64/images/build-manifest.json')); print(json.dumps({k: m[k] for k in ('git','buildroot','kernel','toolchain','source_date_epoch')}, indent=1))"

      - name: Check kernel config
        run: make kernel-config-check

      - name: Boot kernel alone under QEMU + OVMF (UEFI)
        run: make kernel-boot-test

      - name: Boot system (kernel + rootfs, wana-init) under QEMU + OVMF
        run: make system-boot-test

      - name: Boot disk image (OVMF -> GRUB -> kernel -> ext4 root)
        run: make disk-boot-test

      - name: Graphics (disk boot, virtio-gpu, wana-kms, screenshot pixel check)
        run: make graphics-boot-test

      - name: GPU rendering (disk boot, GBM + EGL + GLES via wana-gl, screenshot pixel check)
        run: make gl-boot-test

      - name: Input (disk boot, udev + libinput + xkbcommon via wana-input, QEMU-injected keys and mouse)
        run: make input-boot-test

      - name: Upload logs and kernel
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wana-image-${{ github.sha }}
          path: |
            toolchain-build.log
            image-build.log
            out/logs/
            out/build/wana_x86_64/.config
            out/build/wana_x86_64/build/linux-*/.config
            out/build/wana_x86_64/images/bzImage
            out/build/wana_x86_64/images/rootfs.cpio.zst
            out/build/wana_x86_64/images/disk.img
            out/build/wana_x86_64/images/build-manifest.json
            out/build/wana_x86_64/images/SHA256SUMS
            out/test/*.png
          retention-days: 14
