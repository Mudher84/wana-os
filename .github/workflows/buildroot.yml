name: buildroot

# Stage 4: Buildroot. Runs only when the platform or build glue changes.
on:
  push:
    branches: [main, develop, "feature/**"]
    paths:
      - "platform/**"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/buildroot.yml"
  pull_request:
    paths:
      - "platform/**"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/buildroot.yml"
  workflow_dispatch:

concurrency:
  group: buildroot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: defconfig loads and round-trips
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Fetch pinned Buildroot
        run: make buildroot-src
      - name: Check defconfig
        run: make config-check

  toolchain:
    name: toolchain, kernel, UEFI boot
    needs: config
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Host packages
        run: |
          sudo apt-get update -qq
          grep -v '^#' tools/host-packages-ubuntu.txt | xargs sudo apt-get install -y -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true

      - name: Cache downloads
        uses: actions/cache@v6
        with:
          path: dl
          key: br-dl-${{ hashFiles('platform/buildroot.env', 'platform/configs/*') }}
          restore-keys: br-dl-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.buildroot-ccache
          key: br-ccache-${{ hashFiles('platform/buildroot.env', 'platform/configs/*') }}-${{ github.sha }}
          restore-keys: |
            br-ccache-${{ hashFiles('platform/buildroot.env', 'platform/configs/*') }}-
            br-ccache-

      - name: Build toolchain
        # Full log goes to the artifact; the console shows one line per package step.
        shell: bash
        run: |
          set -o pipefail
          make toolchain 2>&1 | tee toolchain-build.log | { grep -E '^>>>' || true; }

      - name: Smoke-test toolchain
        run: tools/smoke-toolchain.sh out/build/wana_x86_64

      - name: Build kernel
        shell: bash
        run: |
          set -o pipefail
          make kernel 2>&1 | tee kernel-build.log | { grep -E '^>>>' || true; }

      - name: Check kernel config
        run: make kernel-config-check

      - name: Boot kernel under QEMU + OVMF (UEFI)
        run: make kernel-boot-test

      - name: Upload logs and kernel
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wana-kernel-${{ github.sha }}
          path: |
            toolchain-build.log
            kernel-build.log
            out/logs/
            out/build/wana_x86_64/.config
            out/build/wana_x86_64/build/linux-*/.config
            out/build/wana_x86_64/images/bzImage
          retention-days: 14
