# Wana OS Live GRUB configuration.
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
set default=0
set timeout=3
set wana_args=""

if [ -f /live/test.cfg ]; then
    source /live/test.cfg
fi

menuentry "Wana OS Live" {
    echo "[BOOT] info: loading Wana OS Live kernel"
    search --file --set=root /live/bzImage
    linux /live/bzImage rdinit=/sbin/init wana.live=1 console=tty0 console=ttyS0,115200 $wana_args
    initrd /live/rootfs.cpio.zst
    boot
}
