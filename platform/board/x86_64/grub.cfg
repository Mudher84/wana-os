# Wana OS GRUB configuration, installed as /EFI/BOOT/grub.cfg on the EFI
# System Partition. __ROOT_PARTUUID__ is filled in by post-image.sh.

serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

set default=0
set timeout=3
set wana_args=""

# Automated tests place /wana/test.cfg on the ESP to add kernel arguments
# (e.g. wana.test=poweroff) and skip the menu delay, without rebuilding.
if [ -f /wana/test.cfg ]; then
    source /wana/test.cfg
fi

menuentry "Wana OS" {
    echo "[BOOT] info: loading Wana OS kernel"
    linux /wana/bzImage root=PARTUUID=__ROOT_PARTUUID__ rootwait ro console=tty0 console=ttyS0,115200 $wana_args
    boot
}
