# Wana OS GRUB configuration, installed as /EFI/BOOT/grub.cfg on the EFI
# System Partition. Fixed slot/data identifiers are filled by post-image.sh.

serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

set default=0
set timeout=3
set wana_args=""
set wana_slot="A"
set wana_root_uuid="__ROOT_A_PARTUUID__"
set wana_kernel="bzImage-A"

# Locate the persistent data volume. Root-owned boot-slot.cfg is the durable
# slot selector; absence means the factory A slot.
search --no-floppy --fs-uuid --set=wana_data __DATA_FS_UUID__
if [ -n "$wana_data" ]; then
    if [ -f ($wana_data)/var/lib/wana/update/boot-slot.cfg ]; then
        source ($wana_data)/var/lib/wana/update/boot-slot.cfg
    fi

    # A fully staged update is booted before the normal slot. GRUB reads the
    # new kernel/initramfs directly from Data, so the active system root stays
    # untouched while the update environment starts.
    if [ -f ($wana_data)/var/lib/wana/update/pending/update.txt ]; then
        if [ -f ($wana_data)/var/lib/wana/update/pending/rootfs.ext4.zst ]; then
            if [ -f ($wana_data)/var/lib/wana/update/pending/bzImage ]; then
                if [ -f ($wana_data)/var/lib/wana/update/pending/rootfs.cpio.zst ]; then
                    set default=1
                    set timeout=0
                fi
            fi
        fi
    fi
fi

if [ "$wana_slot" = "B" ]; then
    set wana_root_uuid="__ROOT_B_PARTUUID__"
    set wana_kernel="bzImage-B"
else
    set wana_slot="A"
    set wana_root_uuid="__ROOT_A_PARTUUID__"
    set wana_kernel="bzImage-A"
fi

# Automated tests place /wana/test.cfg on the ESP to add kernel arguments
# (e.g. wana.test=poweroff) and skip the menu delay, without rebuilding.
if [ -f /wana/test.cfg ]; then
    source /wana/test.cfg
fi

menuentry "Wana OS" {
    echo "[BOOT] info: loading Wana OS slot ${wana_slot}"
    linux /wana/${wana_kernel} root=PARTUUID=${wana_root_uuid} rootwait ro wana.active=${wana_slot} console=tty0 console=ttyS0,115200 $wana_args
    boot
}

menuentry "Apply staged Wana OS update" {
    echo "[BOOT] info: loading Wana OS update environment"
    search --no-floppy --fs-uuid --set=root __DATA_FS_UUID__
    linux /var/lib/wana/update/pending/bzImage rdinit=/sbin/init wana.update=1 wana.active=${wana_slot} wana.root_a=PARTUUID=__ROOT_A_PARTUUID__ wana.root_b=PARTUUID=__ROOT_B_PARTUUID__ wana.data=UUID=__DATA_FS_UUID__ console=tty0 console=ttyS0,115200
    initrd /var/lib/wana/update/pending/rootfs.cpio.zst
    boot
}

menuentry "Wana OS — force slot A" {
    echo "[BOOT] info: forcing Wana OS slot A"
    linux /wana/bzImage-A root=PARTUUID=__ROOT_A_PARTUUID__ rootwait ro wana.active=A console=tty0 console=ttyS0,115200 $wana_args
    boot
}

menuentry "Wana OS — force slot B" {
    echo "[BOOT] info: forcing Wana OS slot B"
    linux /wana/bzImage-B root=PARTUUID=__ROOT_B_PARTUUID__ rootwait ro wana.active=B console=tty0 console=ttyS0,115200 $wana_args
    boot
}
