# Wana OS disk image: GPT, EFI System Partition + ext4 root.
# All identifiers come from disk.env (fixed: reproducible image, and grub.cfg
# can refer to the root PARTUUID); the installer generates fresh ones.

image esp.vfat {
	vfat {
		label = "WANA-ESP"
		extraargs = "--invariant -i __ESP_VOLID__"
		file EFI {
			image = "efi-part/EFI"
		}
		file wana {
			image = "efi-part/wana"
		}
	}
	size = 64M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = __DISK_GUID__
	}

	partition esp {
		image = "esp.vfat"
		partition-type-uuid = U
		partition-uuid = __ESP_PARTUUID__
		offset = 1M
		bootable = true
	}

	# Type: Linux root (x86-64), from the Discoverable Partitions Specification.
	partition root {
		image = "rootfs.ext4"
		partition-type-uuid = 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
		partition-uuid = __ROOT_PARTUUID__
	}
}
