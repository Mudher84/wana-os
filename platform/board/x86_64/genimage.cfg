# Wana OS disk image: GPT, EFI System Partition + ext4 root.
# The root PARTUUID is fixed so grub.cfg can refer to it; the installer
# generates fresh UUIDs for real installations.

image esp.vfat {
	vfat {
		label = "WANA-ESP"
		file EFI {
			image = "efi-part/EFI"
		}
		file wana {
			image = "efi-part/wana"
		}
	}
	size = 64M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition esp {
		image = "esp.vfat"
		partition-type-uuid = U
		offset = 1M
		bootable = true
	}

	# Type: Linux root (x86-64), from the Discoverable Partitions Specification.
	partition root {
		image = "rootfs.ext4"
		partition-type-uuid = 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
		partition-uuid = __ROOT_PARTUUID__
	}
}
