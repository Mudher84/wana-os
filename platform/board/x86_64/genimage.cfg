# Wana OS disk image: GPT, EFI System Partition + A/B replaceable ext4 roots
# + persistent ext4 data. The data partition stays last so it can grow to the
# installed disk without changing either fixed-size system slot.
# All identifiers come from disk.env (fixed: reproducible image, and grub.cfg
# can refer to the root PARTUUID); the installer generates fresh ones.

image esp.vfat {
	vfat {
		label = "WANA-ESP"
		extraargs = "--invariant -i __ESP_VOLID__"
		file EFI {
			image = "efi-part/EFI"
		}
		file wana {
			image = "efi-part/wana"
		}
	}
	size = 64M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = __DISK_GUID__
	}

	partition esp {
		image = "esp.vfat"
		partition-type-uuid = U
		partition-uuid = __ESP_PARTUUID__
		offset = 1M
		bootable = true
	}

	# Active factory slot A.
	partition root-a {
		image = "rootfs.ext4"
		partition-type-uuid = 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
		partition-uuid = __ROOT_A_PARTUUID__
	}

	# Inactive factory slot B. It is intentionally empty until the first
	# verified update writes a complete ext4 image into it.
	partition root-b {
		size = __ROOT_SLOT_SIZE__
		partition-type-uuid = 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
		partition-uuid = __ROOT_B_PARTUUID__
	}

	# Persistent user/system state. This partition is intentionally last.
	partition data {
		image = "data.ext4"
		partition-type-uuid = 0fc63daf-8483-4772-8e79-3d69d8477de4
		partition-uuid = __DATA_PARTUUID__
	}
}
